<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="stylesheet" href="css/index.css" />
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <main class="container stack gap-l">
      <header class="stack gap-xs">
        <h1 class="title">Pokédex</h1>
        <p class="text-muted">Skriv en typ på engelska, till exempel fire, water eller dragon.</p>
      </header>

      <form class="search-form cluster" id="search-form">
        <label class="visually-hidden" for="type-input">Typ</label>
        <input
          class="input"
          id="type-input"
          type="text"
          placeholder="fire"
          autocomplete="off"
          required
        />
        <button class="button" type="submit">Hämta</button>
      </form>

      <section class="stack gap-s" aria-label="Resultat">
        <p class="status" id="status" role="status">Inget hämtat än.</p>
        <ul class="pokemon-list" id="pokemon-list"></ul>
      </section>
    </main>
  </body>
</html>
